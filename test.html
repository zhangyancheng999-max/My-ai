<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>联网测试</title>
<style>
  body { padding: 30px; font-family: sans-serif; text-align: center; background: #f0f2f5; }
  button { padding: 15px 30px; font-size: 18px; background: #4F46E5; color: #fff; border: none; border-radius: 10px; margin-top: 50px; }
  #result { margin-top: 20px; padding: 15px; background: #fff; border-radius: 10px; word-break: break-all; }
</style>
</head>
<body>
  <h2>安卓 WebView 联网测试</h2>
  <button onclick="testNetwork()">点击测试联网</button>
  <div id="result">等待测试...</div>

<script>
  async function testNetwork() {
    const resDiv = document.getElementById('result');
    resDiv.innerText = '正在请求...';
    try {
      // 测试请求百度，这是一个绝对安全、国内可以直连的地址
      const res = await fetch('https://www.baidu.com');
      if (res.ok) {
        resDiv.innerText = '✅ 联网成功！状态码: ' + res.status + '。说明 WebView 网络权限正常，是原 APP 代码或跨域问题。';
      } else {
        resDiv.innerText = '❌ 联网失败，状态码: ' + res.status;
      }
    } catch (e) {
      // 如果连百度都请求不了，说明是打包工具完全没给联网权限
      resDiv.innerText = '❌ 请求出错：' + e.message + '\n\n这 100% 是 WebToApp 没有开启网络权限导致的！';
    }
  }
</script>
</body>
</html>
